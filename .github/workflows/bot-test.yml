name: Bot Test
on:
  push:
    branches: ['tgbot']
    paths:
      - 'bot/**'
      - 'yt_dlp/**'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/bot-test.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'bot/**'
      - 'yt_dlp/**'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/bot-test.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: bot-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Telegram bot tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: '3.12'
    - name: Install requirements
      shell: bash
      run: |
        # Бот импортирует yt-dlp из ЭТОГО репозитория, а не с PyPI —
        # так же, как это делает bot/Dockerfile.
        python -m pip install -U pip
        # extras `default` — как в bot/Dockerfile: mutagen, pycryptodomex,
        # brotli, websockets, yt-dlp-ejs. Без них тесты проверяли бы не то,
        # что реально работает в контейнере.
        python -m pip install -e ".[default,curl-cffi]"
        python -m pip install -r bot/requirements-dev.txt
    - name: Lint
      shell: bash
      working-directory: bot
      run: ruff check telegram_bot tests
    - name: Run tests
      timeout-minutes: 10
      shell: bash
      working-directory: bot
      run: pytest tests -q
    - name: Check shell scripts
      run: shellcheck bot/entrypoint.sh bot/cf-entrypoint.sh bot/deploy.sh bot/nginx/entrypoint.sh bot/nginx/renew-certificate.sh bot/telegram_bot/entrypoint.sh bot/tests/nginx-container-check.sh
    - name: Build bot and supporting images
      timeout-minutes: 20
      run: |
        docker build --pull -f bot/Dockerfile -t ytdlp-bot:test .
        docker build --pull -f bot/Dockerfile.cloudflared -t ytdlp-cloudflared:test .
        docker build --pull -f bot/Dockerfile.nginx -t ytdlp-nginx:test .
    - name: Validate real media tools under isolation
      run: |
        docker run --rm --network none --user 1000:1000 --read-only \
          --tmpfs /tmp:rw,nosuid,size=256m --entrypoint python \
          -v "$PWD/bot/tests/container_media_check.py:/check.py:ro" \
          ytdlp-bot:test /check.py
    - name: Validate Nginx template
      run: |
        bash bot/tests/nginx-container-check.sh
